		<!-- Google tag (gtag.js) -->

		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());

			gtag('config', 'G-JS8DE3PMK3');
		</script>
		<meta charset="utf-8" />

		<link rel="icon" href="/favicon.png" />
		<link rel="icon" href="/2024-icon.svg" type="image/svg+xml"/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffd100">

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			if (
				'theme' in localStorage && JSON.parse(localStorage.theme) === 'dark' ||
				(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
			) {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.add('light');
			}
		</script>

		%sveltekit.head%
		<link rel="preload" href="/fonts/avertastd-regular-webfont.woff2" as="font" type="font/woff2" crossorigin>
